<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoWifi Help &amp; Documentation</title>
  <style>
    :root {
      --bg: #0F1318;
      --card-bg: #1A212A;
      --card-border: #2A3644;
      --primary: #FF991F;
      --primary-hover: #E08518;
      --text: #F0F4F8;
      --text-muted: #8FA2B5;
      --code-bg: #121820;
      --table-stripe: #151C24;
      --badge-bg: rgba(255, 153, 31, 0.15);
      --badge-text: #FFB347;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 30px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #1A212A 0%, #222C38 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 153, 31, 0.3);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10B981;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .btn {
      background: var(--primary);
      color: #000000;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #384759;
    }
    .quick-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }
    .nav-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-pill:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    /* Markdown Styles */
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      scroll-margin-top: 30px;
    }
        /* Responsive Images & Google Play Badge */
    .markdown-body img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .markdown-body img[src*="badge"],
    .markdown-body a[href*="play.google.com"] img {
      max-width: 200px; /* Scales the Play badge to standard mobile badge size */
      height: auto;
      margin: 8px 0 16px 0;
    }
    .markdown-body h1 {
      font-size: 26px;
      color: var(--primary);
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 8px;
      margin-top: 10px;
      margin-bottom: 16px;
    }
    .markdown-body h2 {
      font-size: 20px;
      color: #FFFFFF;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 6px;
      margin-top: 28px;
      margin-bottom: 14px;
    }
    .markdown-body h3 {
      font-size: 16px;
      color: var(--primary);
      margin-top: 20px;
      margin-bottom: 10px;
    }
    .markdown-body p {
      margin-bottom: 14px;
      color: var(--text);
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      background: rgba(255, 153, 31, 0.08);
      padding: 10px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-style: italic;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px 0;
      background: var(--code-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-body th, .markdown-body td {
      padding: 12px 14px;
      text-align: left;
      border: 1px solid var(--card-border);
    }
    .markdown-body th {
      background: #1F2833;
      color: var(--primary);
      font-weight: 700;
    }
    .markdown-body tr:nth-child(even) {
      background: var(--table-stripe);
    }
    .markdown-body code {
      background: var(--code-bg);
      color: #FFB347;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .markdown-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      color: #E2E8F0;
    }
    .markdown-body ul, .markdown-body ol {
      padding-left: 24px;
      margin-bottom: 16px;
    }
    .markdown-body li {
      margin-bottom: 6px;
    }
    .markdown-body a {
      color: #38BDF8;
      text-decoration: none;
      transition: color 0.2s;
    }
    .markdown-body a:hover {
      color: #7DD3FC;
      text-decoration: underline;
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--card-border);
      margin: 24px 0;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-title-row">
        <div class="app-title">
          <span>⚡ AutoWifi Help Center</span>
        </div>
        <div class="source-badge">
          <span class="live-dot"></span>
          <span>Live GitHub Sync</span>
        </div>
      </div>
      <p style="color: var(--text-muted); font-size: 14px;">
        Complete interactive manual rendered dynamically from repository markdown.
      </p>

      <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search topics (e.g. SOCKS, VPN, Camera, Port, Split)..." oninput="filterContent()">
        <button class="btn" onclick="fetchAndRender()">🔄 Refresh from GitHub</button>
        <button class="btn btn-secondary" onclick="window.open('https://github.com/gyanaditya/AutoWIFI--Dual-Network-Engine/blob/main/Wiki', '_blank')">GitHub Source</button>
      </div>
    </div>

    <!-- Quick Navigation Pills -->
    <div class="quick-nav">
      <a href="#quick-start" class="nav-pill">Quick Start</a>
      <a href="#network-modes" class="nav-pill">Network Modes</a>
      <a href="#protocols" class="nav-pill">Protocols</a>
      <a href="#socks5-proxy" class="nav-pill">SOCKS5 Proxy</a>
      <a href="#vpn-and-app-split-routing" class="nav-pill">VPN &amp; Split</a>
      <a href="#reverse-hotspot" class="nav-pill">Reverse Hotspot</a>
      <a href="#troubleshooting" class="nav-pill">Troubleshooting</a>
    </div>

    <!-- Rendered Markdown Body -->
    <div class="content-card">
      <div id="content" class="markdown-body">Rendering content...</div>
      <div class="status-bar">
        <span id="statusText">Loaded from GitHub Raw Wiki</span>
        <span id="charCount"></span>
      </div>
    </div>
  </div>

  <script>
    const rawUrl = 'https://raw.githubusercontent.com/gyanaditya/AutoWIFI--Dual-Network-Engine/refs/heads/main/Wiki';
    let fullHtml = '';

    // Slugify helper: matches standard GitHub markdown anchor IDs
    function slugify(text) {
      return (text || '')
        .replace(/<[^>]*>/g, '') // remove HTML tags
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '') // remove special punctuation
        .replace(/[\s_-]+/g, '-') // collapse spaces into hyphens
        .replace(/^-+|-+$/g, ''); // strip leading/trailing hyphens
    }

    // Configure marked renderer to attach id="slug" to all headings
    marked.use({
      renderer: {
        heading(item) {
          const depth = item.depth;
          const text = this.parser.parseInline(item.tokens);
          const raw = item.raw || item.text || text;
          const id = slugify(raw);
          return `<h${depth} id="${id}">${text}</h${depth}>\n`;
        }
      }
    });

    async function fetchAndRender() {
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = 'Fetching latest from GitHub...';

      try {
        const resp = await fetch(rawUrl + '?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const md = await resp.text();
        renderMarkdown(md, 'Live synced from GitHub');
      } catch (err) {
        console.warn('Live fetch failed: ', err);
        statusEl.textContent = 'Failed to load live from GitHub. Check network.';
      }
    }

    function renderMarkdown(mdText, status) {
      fullHtml = marked.parse(mdText);
      document.getElementById('content').innerHTML = fullHtml;
      document.getElementById('statusText').textContent = 'Status: ' + status;
      document.getElementById('charCount').textContent = mdText.length + ' characters';

      // If URL already has a hash (#quick-start), scroll to it after rendering
      scrollToHash(window.location.hash);
    }

    function scrollToHash(hash) {
      if (!hash) return;
      const id = decodeURIComponent(hash.replace(/^#/, ''));
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 80);
    }

    // Intercept clicks on internal #anchor links for smooth scrolling
    document.addEventListener('click', function(e) {
      const anchor = e.target.closest('a[href^="#"]');
      if (anchor) {
        const hash = anchor.getAttribute('href');
        if (hash && hash.length > 1) {
          const id = decodeURIComponent(hash.replace(/^#/, ''));
          const el = document.getElementById(id);
          if (el) {
            e.preventDefault();
            // Clear active search if present so the full document is visible
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value.trim() !== '') {
              searchInput.value = '';
              document.getElementById('content').innerHTML = fullHtml;
            }
            history.pushState(null, null, hash);
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      }
    });

    window.addEventListener('hashchange', () => {
      scrollToHash(window.location.hash);
    });

    function filterContent() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        document.getElementById('content').innerHTML = fullHtml;
        return;
      }
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = fullHtml;

      const matchedBlocks = [];
      const sections = tempDiv.querySelectorAll('h1, h2, h3, p, table, blockquote, ul, ol');
      sections.forEach(sec => {
        if (sec.textContent.toLowerCase().includes(query)) {
          matchedBlocks.push(sec.outerHTML);
        }
      });

      if (matchedBlocks.length > 0) {
        document.getElementById('content').innerHTML = '<div style="padding: 8px 0; color: var(--primary); font-size: 13px; font-weight: 600;">Found ' + matchedBlocks.length + ' matching sections for "' + query + '":</div>' + matchedBlocks.join('');
      } else {
        document.getElementById('content').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted);">No topics found matching "' + query + '". Try another search term.</div>';
      }
    }

    fetchAndRender();
  </script>
</body>
</html>
